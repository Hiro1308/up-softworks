<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07110b" />
  <title>UP Torneos · Estado del pago</title>
  <link rel="icon" type="image/png" href="/uptorneos.png" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f4fff7;
      background:
        radial-gradient(circle at 50% -10%, rgba(32,214,107,.22), transparent 38rem),
        #07110b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 520px);
      padding: 38px 30px 30px;
      border-radius: 28px;
      background: rgba(12,27,18,.94);
      border: 1px solid rgba(124,255,175,.14);
      box-shadow: 0 28px 90px rgba(0,0,0,.35);
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 24px;
    }
    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      font-weight: 900;
      background: rgba(32,214,107,.12);
      color: #20d66b;
      border: 1px solid rgba(32,214,107,.3);
    }
    .icon.loading {
      color: #c9e8d4;
      background: rgba(255,255,255,.05);
      border-color: rgba(255,255,255,.1);
    }
    .icon.error {
      color: #ff8585;
      background: rgba(255,90,90,.1);
      border-color: rgba(255,90,90,.22);
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,.16);
      border-top-color: #20d66b;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 34px);
      letter-spacing: -.9px;
    }
    p {
      margin: 14px auto 0;
      max-width: 390px;
      color: #a7b9ad;
      line-height: 1.55;
      font-size: 15px;
    }
    .hint {
      margin-top: 26px;
      padding: 14px 16px;
      border-radius: 15px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.07);
      color: #d8e5dc;
      font-size: 13px;
      line-height: 1.45;
    }
    .brand {
      margin-top: 26px;
      font-size: 12px;
      color: #71877a;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/uptorneos.png" alt="UP Torneos" />

    <div id="icon" class="icon loading">
      <div class="spinner"></div>
    </div>

    <h1 id="title">Confirmando tu pago…</h1>
    <p id="message">
      PayPal aprobó la operación. Estamos esperando la confirmación final.
    </p>

    <div id="hint" class="hint">
      Podés dejar esta pantalla abierta unos segundos.
    </div>

    <div class="brand">UP Torneos · UP Softworks</div>
  </main>

  <script>
    const SUPABASE_URL = "https://txouacdkcxvjceuscrba.supabase.co";
    const params = new URLSearchParams(window.location.search);
    const attempt = params.get("attempt") || "";

    const icon = document.getElementById("icon");
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const hint = document.getElementById("hint");

    function completed() {
      icon.className = "icon";
      icon.innerHTML = "✓";
      title.textContent = "Pago completado";
      message.textContent =
        "Tu pago fue recibido y confirmado correctamente.";
      hint.textContent =
        "Ya podés cerrar esta pestaña y volver a la aplicación.";
      document.title = "UP Torneos · Pago completado";
    }

    function failed() {
      icon.className = "icon error";
      icon.innerHTML = "!";
      title.textContent = "No pudimos confirmar el pago";
      message.textContent =
        "La operación no quedó confirmada. Volvé a la aplicación para revisar el estado o intentar nuevamente.";
      hint.textContent =
        "Si el importe fue debitado, no vuelvas a pagar: esperá unos minutos y revisá la aplicación.";
      document.title = "UP Torneos · Pago no confirmado";
    }

    function stillProcessing() {
      title.textContent = "Pago en proceso";
      message.textContent =
        "La operación fue aprobada y todavía estamos esperando la confirmación final.";
      hint.textContent =
        "Ya podés volver a la aplicación. El estado se actualizará automáticamente cuando quede confirmado.";
    }

    async function getStatus() {
      const response = await fetch(
        `${SUPABASE_URL}/functions/v1/paypal-estado-pago`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ attempt }),
        }
      );

      if (!response.ok) {
        throw new Error("status request failed");
      }

      return response.json();
    }

    async function poll() {
      if (!/^[a-f0-9]{32}$/i.test(attempt)) {
        failed();
        return;
      }

      // ~25 segundos máximo. Normalmente el webhook resuelve antes.
      for (let i = 0; i < 20; i += 1) {
        try {
          const data = await getStatus();

          if (data?.paid === true) {
            completed();
            return;
          }

          if (data?.failed === true) {
            failed();
            return;
          }
        } catch (_) {
          // Seguimos intentando: puede haber una demora temporal.
        }

        await new Promise((resolve) => setTimeout(resolve, 1250));
      }

      stillProcessing();
    }

    void poll();
  </script>
</body>
</html>
