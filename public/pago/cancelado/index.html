<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07110b" />
  <title>UP Torneos · Pago cancelado</title>
  <link rel="icon" type="image/png" href="/uptorneos.png" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f4fff7;
      background:
        radial-gradient(circle at 50% -10%, rgba(32,214,107,.16), transparent 38rem),
        #07110b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 520px);
      padding: 38px 30px 30px;
      border-radius: 28px;
      background: rgba(12,27,18,.94);
      border: 1px solid rgba(124,255,175,.14);
      box-shadow: 0 28px 90px rgba(0,0,0,.35);
      text-align: center;
    }
    .logo { width: 72px; height: 72px; object-fit: contain; margin-bottom: 24px; }
    .icon {
      width: 68px; height: 68px; margin: 0 auto 20px; border-radius: 50%;
      display: grid; place-items: center; font-size: 32px; font-weight: 800;
      color: #d8e5dc; background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
    }
    h1 { margin: 0; font-size: clamp(26px, 6vw, 34px); letter-spacing: -.9px; }
    p { margin: 14px auto 0; max-width: 390px; color: #a7b9ad; line-height: 1.55; font-size: 15px; }
    .hint {
      margin-top: 26px; padding: 14px 16px; border-radius: 15px;
      background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07);
      color: #d8e5dc; font-size: 13px; line-height: 1.45;
    }
    .brand { margin-top: 26px; font-size: 12px; color: #71877a; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/uptorneos.png" alt="UP Torneos" />
    <div class="icon">×</div>
    <h1>Pago cancelado</h1>
    <p>No se realizó ningún nuevo cobro desde esta pantalla.</p>
    <div class="hint">
      Ya podés cerrar esta pestaña y volver a la aplicación.
    </div>
    <div class="brand">UP Torneos · UP Softworks</div>
  </main>
</body>
</html>
